name: Apple credential preflight
run-name: Apple signing preflight · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ohida/codex-echo/.github/workflows/release-build.yml@4966219382074d9cecdd0ddc4509a29bbe6a6a89
    with:
      credential_preflight: true
    secrets: inherit
