name: Apple credential preflight
run-name: Apple signing preflight · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ohida/codex-echo/.github/workflows/release-build.yml@6b3d4c01e234e23da73f7a37e8308439a8c48310
    with:
      credential_preflight: true
    secrets: inherit
