name: Apple credential preflight
run-name: Apple signing preflight · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ohida/codex-echo/.github/workflows/release-build.yml@f31d9d7072054a1ba5a667caf607206b16e9af1d
    with:
      credential_preflight: true
    secrets: inherit
