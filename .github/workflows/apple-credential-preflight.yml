name: Apple credential preflight
run-name: Apple signing preflight · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ohida/codex-echo/.github/workflows/release-build.yml@74966fcf12a31d6d1e146fc2d8aeb08705429b1a
    with:
      credential_preflight: true
    secrets: inherit
