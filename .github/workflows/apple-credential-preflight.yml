name: Apple credential preflight
run-name: Apple signing preflight · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: {}

jobs:
  preflight:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ohida/codex-echo/.github/workflows/release-build.yml@f0d1cc023a830e32f8d3e1de645de10a01ea5385
    with:
      credential_preflight: true
    secrets: inherit
