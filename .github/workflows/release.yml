name: Build release artifacts
run-name: Release artifact build · ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*-build.*"

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    uses: ohida/codex-echo/.github/workflows/release-build.yml@f0d1cc023a830e32f8d3e1de645de10a01ea5385
    secrets: inherit
