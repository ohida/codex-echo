name: Build release artifacts
run-name: Release artifact build · ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*-build.*"

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
